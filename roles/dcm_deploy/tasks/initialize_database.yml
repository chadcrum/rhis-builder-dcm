---
- name: Start PostgreSQL service
  ansible.builtin.systemd_service:
    name: dcm-postgres.service
    state: started
    enabled: true

- name: Wait for PostgreSQL to be ready
  ansible.builtin.command: podman exec postgres pg_isready -U {{ dcm_db_user }} -d postgres
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 30
  delay: 2
  changed_when: false

- name: Check if databases exist
  ansible.builtin.command: podman exec postgres psql -U {{ dcm_db_user }} -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='{{ item }}'"
  register: db_check
  loop:
    - service-provider
    - policy-manager
    - catalog-manager
    - placement-manager
  changed_when: false

- name: Create missing databases
  ansible.builtin.command: podman exec postgres createdb -U {{ dcm_db_user }} {{ item.item }}
  loop: "{{ db_check.results }}"
  when: item.stdout | trim != "1"
  register: db_create
  changed_when: db_create.rc == 0
  failed_when:
    - db_create.rc != 0
    - "'already exists' not in (db_create.stderr | default(''))"
